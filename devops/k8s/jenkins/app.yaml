apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-rent-api
  namespace: pg-rent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-rent-api
  template:
    metadata:
      labels:
        app: pg-rent-api
    spec:
      containers:
        - name: api
          image: __API_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pg-rent-secrets
                  key: JWT_SECRET
            - name: TURSO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pg-rent-secrets
                  key: TURSO_DATABASE_URL
            - name: TURSO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pg-rent-secrets
                  key: TURSO_AUTH_TOKEN
            - name: VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-rent-secrets
                  key: VIEWER_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pg-rent
spec:
  type: ClusterIP
  selector:
    app: pg-rent-api
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-rent-web
  namespace: pg-rent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-rent-web
  template:
    metadata:
      labels:
        app: pg-rent-web
    spec:
      containers:
        - name: web
          image: __WEB_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pg-rent-web
  namespace: pg-rent
spec:
  type: NodePort
  selector:
    app: pg-rent-web
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
