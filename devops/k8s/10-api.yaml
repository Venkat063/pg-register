# The Express API. Not exposed outside the cluster — only the web (nginx) pods call it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pg-rent
  labels:
    app: pg-rent
    component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # never drop below 2 healthy pods during a deploy
      maxSurge: 1
  selector:
    matchLabels:
      app: pg-rent
      component: api
  template:
    metadata:
      labels:
        app: pg-rent
        component: api
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # the "node" user in the image (must be numeric for runAsNonRoot)
        runAsGroup: 1000
      containers:
        - name: api
          # __REGISTRY__ and __TAG__ are filled in by the Jenkins pipeline.
          image: __REGISTRY__/pg-rent/api:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: production
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pg-rent-secrets
                  key: JWT_SECRET
            - name: TURSO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pg-rent-secrets
                  key: TURSO_DATABASE_URL
            - name: TURSO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pg-rent-secrets
                  key: TURSO_AUTH_TOKEN
            - name: VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-rent-secrets
                  key: VIEWER_PASSWORD
                  optional: true
          readinessProbe:          # a pod only receives traffic once this passes
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:           # restart the pod if it stops answering
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api               # nginx proxies to http://api:4000, so this name matters
  namespace: pg-rent
  labels:
    app: pg-rent
    component: api
spec:
  type: ClusterIP
  selector:
    app: pg-rent
    component: api
  ports:
    - name: http
      port: 4000
      targetPort: http
