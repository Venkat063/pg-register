# Serves the built React app and forwards /api/* to the API service.
# "api" is the service name — it resolves via Docker Compose networking locally
# and via Kubernetes DNS (Service "api" in the same namespace) in the cluster.
# Because the browser only ever talks to this one address, there is no CORS.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> Express container. No URI part on proxy_pass, so /api/... is passed through unchanged.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 5m;   # matches the API's 5mb JSON limit (bulk import)
    }

    # Hashed build assets never change, so browsers can cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must never be cached, or users won't pick up new deployments.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
